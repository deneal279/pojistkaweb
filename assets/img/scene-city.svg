<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Ilustrace: velkoměsto za soumraku">
  <style>
    .stars circle { animation: twinkle 2.4s ease-in-out infinite; }
    .stars circle:nth-child(2n) { animation-delay: -1.2s; }
    .stars circle:nth-child(3n) { animation-delay: -.6s; animation-duration: 3.2s; }
    .win rect:nth-child(3n) { animation: lights 5s steps(1) infinite; }
    .win rect:nth-child(4n+1) { animation: lights 7s steps(1) infinite -2s; }
    .plane { animation: fly 12s linear infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .cars { animation: cars 3s linear infinite; }
    @keyframes twinkle { 50% { opacity: .2; } }
    @keyframes lights { 0% { opacity: .85; } 40% { opacity: .15; } 70% { opacity: .85; } }
    @keyframes fly { from { transform: translate(-40px, 0); } to { transform: translate(460px, -40px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes cars { from { transform: translateX(-110px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F4FB8"/><stop offset=".6" stop-color="#5C8EF0"/><stop offset="1" stop-color="#FFC7A0"/></linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#c1)"/>
  <g class="stars" fill="#fff"><circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="24" r="1.2"/><circle cx="300" cy="34" r="1.6"/><circle cx="360" cy="70" r="1.2"/><circle cx="210" cy="50" r="1"/></g>
  <circle cx="330" cy="120" r="22" fill="#FFE3B8" opacity=".9"/>
  <g fill="#173A80">
    <rect x="20" y="130" width="40" height="130"/><rect x="66" y="100" width="34" height="160"/><path d="M110 260V80l20-30 20 30v180Z"/><rect x="128" y="20" width="4" height="34"/>
    <rect x="160" y="120" width="44" height="140"/><rect x="210" y="90" width="30" height="170"/><rect x="246" y="140" width="50" height="120"/><rect x="302" y="110" width="36" height="150"/><rect x="344" y="150" width="50" height="110"/>
  </g>
  <g class="win" fill="#FFD978" opacity=".85">
    <rect x="28" y="142" width="6" height="8"/><rect x="44" y="160" width="6" height="8"/><rect x="74" y="112" width="6" height="8"/><rect x="86" y="140" width="6" height="8"/><rect x="120" y="100" width="5" height="8"/><rect x="134" y="130" width="5" height="8"/><rect x="170" y="134" width="6" height="8"/><rect x="186" y="160" width="6" height="8"/><rect x="218" y="106" width="5" height="8"/><rect x="228" y="140" width="5" height="8"/><rect x="256" y="156" width="6" height="8"/><rect x="276" y="176" width="6" height="8"/><rect x="310" y="126" width="6" height="8"/><rect x="322" y="150" width="6" height="8"/><rect x="354" y="166" width="6" height="8"/><rect x="374" y="190" width="6" height="8"/>
  </g>
  <rect y="236" width="400" height="24" fill="#0F2B66"/>
  <path class="cars" d="M30 248h50M140 248h50M250 248h50M360 248h50M470 248h50" stroke="#FFD978" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <g class="plane"><g transform="translate(0 70)"><path d="M0 4h18l6-3 2 1-4 4h-22Z" fill="#fff" opacity=".9"/><circle class="blink" cx="24" cy="4" r="1.6" fill="#FF5B5B"/></g></g>
</svg>
