<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Ilustrace: tropický ostrov">
  <style>
    .palm { transform-box: view-box; transform-origin: 314px 116px; animation: sway 4.5s ease-in-out infinite; }
    .boat { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .boatMove { animation: sail 24s ease-in-out infinite alternate; }
    .shine { animation: shine 2.6s ease-in-out infinite; }
    .waves { animation: drift 5s ease-in-out infinite alternate; }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes bob { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-3px); } }
    @keyframes sail { from { transform: translateX(-30px); } to { transform: translateX(110px); } }
    @keyframes shine { 50% { opacity: .2; } }
    @keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(14px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="e1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB86B"/><stop offset=".55" stop-color="#FFD9A0"/><stop offset="1" stop-color="#BFE6FF"/></linearGradient>
    <linearGradient id="e2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16B5C9"/><stop offset="1" stop-color="#0B63C9"/></linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#e1)"/>
  <circle cx="200" cy="150" r="46" fill="#FFF0B8"/>
  <rect y="150" width="400" height="110" fill="url(#e2)"/>
  <g class="shine" fill="#FFF0B8" opacity=".55"><rect x="160" y="160" width="80" height="4" rx="2"/><rect x="175" y="172" width="50" height="3" rx="1.5"/><rect x="186" y="183" width="28" height="3" rx="1.5"/></g>
  <path d="M250 196c30-14 80-16 110 0Z" fill="#FBE3B0"/>
  <path d="M300 196c-4-30 0-60 14-80" fill="none" stroke="#9A6A3B" stroke-width="6" stroke-linecap="round"/>
  <g class="palm" fill="#0E8C63"><path d="M314 116c-14-16-36-18-52-8 18-2 34 4 52 8Z"/><path d="M314 116c8-20 30-28 48-22-18 2-32 10-48 22Z"/><path d="M314 116c18-8 38-4 48 10-14-6-30-8-48-10Z"/><path d="M314 116c-4 16-16 30-34 34 12-10 24-20 34-34Z"/></g>
  <!-- long-tail boat -->
  <g class="boatMove"><g transform="translate(60 196)"><g class="boat"><path d="M0 0h80c-6 10-20 14-40 14S6 10 0 0Z" fill="#8C5A2D"/><path d="M76 0l14-16" stroke="#8C5A2D" stroke-width="3" stroke-linecap="round"/><rect x="24" y="-12" width="30" height="12" rx="2" fill="#1E7BFF"/></g></g></g>
  <g class="waves" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".45"><path d="M40 236q10-6 20 0t20 0"/><path d="M220 226q10-6 20 0t20 0"/></g>
</svg>
