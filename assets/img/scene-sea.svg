<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Ilustrace: Středomoří">
  <style>
    .cloud { animation: drift 14s ease-in-out infinite alternate; }
    .boat { animation: bob 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .boatMove { animation: sail 22s ease-in-out infinite alternate; }
    .waves { animation: drift 5s ease-in-out infinite alternate-reverse; }
    .sun { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drift { from { transform: translateX(-12px); } to { transform: translateX(16px); } }
    @keyframes bob { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } }
    @keyframes sail { from { transform: translateX(-40px); } to { transform: translateX(120px); } }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BB8FF"/><stop offset="1" stop-color="#D6EEFF"/></linearGradient>
    <linearGradient id="s1sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A86F0"/><stop offset="1" stop-color="#0B57C2"/></linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#s1)"/>
  <circle class="sun" cx="320" cy="70" r="30" fill="#FFD15C"/>
  <g class="cloud" fill="#fff" opacity=".9"><ellipse cx="90" cy="60" rx="40" ry="12"/><ellipse cx="110" cy="52" rx="20" ry="13"/></g>
  <path d="M0 160c40-30 80-36 120-22l40 22Z" fill="#9CC9A4"/>
  <path d="M220 160c30-40 90-60 180-40v40Z" fill="#B6D9B9"/>
  <!-- white houses -->
  <g transform="translate(250 104)">
    <rect x="0" y="20" width="34" height="36" fill="#fff"/><rect x="30" y="8" width="30" height="48" fill="#F6FAFF"/>
    <rect x="58" y="26" width="30" height="30" fill="#fff"/>
    <path d="M30 8a15 13 0 0 1 30 0Z" fill="#1E7BFF"/>
    <g fill="#1E7BFF"><rect x="10" y="32" width="8" height="10" rx="4"/><rect x="40" y="22" width="8" height="10" rx="4"/><rect x="68" y="36" width="8" height="10" rx="4"/></g>
  </g>
  <rect y="158" width="400" height="102" fill="url(#s1sea)"/>
  <g class="waves" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".4"><path d="M30 190q10-6 20 0t20 0"/><path d="M200 210q10-6 20 0t20 0"/><path d="M320 186q10-6 20 0t20 0"/></g>
  <g class="boatMove"><g transform="translate(110 168)"><g class="boat"><path d="M0 26h46l-7 8H7Z" fill="#fff"/><path d="M24 24V-8l20 32Z" fill="#fff"/><path d="M21 24V0L6 22Z" fill="#FFB22E"/></g></g></g>
</svg>
